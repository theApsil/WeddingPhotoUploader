<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1410">
  <!-- Base path is detected from the script URL; add <meta name="base-path"> only to override. -->
  <title>Данил и Полина — галерея</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="glow glow-1" aria-hidden="true"></div>
  <div class="glow glow-2" aria-hidden="true"></div>

  <div class="wrap">
    <header class="hero-mini">
      <p class="eyebrow">Свадьба</p>
      <h1 class="names">
        <span data-site="groom">Данил</span>
        <span class="amp">&amp;</span>
        <span data-site="bride">Полина</span>
      </h1>
      <p class="date" data-site="dateShort">17 · 10 · 2026</p>
      <p class="tagline">Общая галерея гостей</p>
    </header>

    <nav class="nav" aria-label="Разделы">
      <a class="nav-link" href="index.html">Главная</a>
      <a class="nav-link" href="upload.html">Загрузить</a>
      <a class="nav-link is-active" href="gallery.html">Галерея</a>
    </nav>

    <section class="card">
      <div class="gallery-head">
        <div id="total" class="hints">Всего · …</div>
        <div class="filters" role="group" aria-label="Фильтр галереи">
          <button type="button" class="filter-btn is-active" data-kind="all">Все</button>
          <button type="button" class="filter-btn" data-kind="image">Фото</button>
          <button type="button" class="filter-btn" data-kind="video">Видео</button>
        </div>
      </div>

      <div class="gallery-sub" id="guest-row">
        <label class="guest-label" for="guest-filter">Гость</label>
        <select id="guest-filter" class="guest-select" aria-label="Фильтр по гостю">
          <option value="">Все</option>
        </select>
      </div>

      <div id="alert" class="alert alert-error" hidden></div>
      <div id="status" class="loading">Загружаю…</div>
      <div id="gallery" class="gallery"></div>
      <button type="button" id="load-more" class="btn btn-ghost load-more" hidden>
        Показать ещё
      </button>
    </section>

    <p class="footer">
      Данные: API /api/photos · <a href="admin.html">Админ</a>
    </p>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true">
    <button type="button" class="lb-close" aria-label="Закрыть">✕</button>
    <button type="button" class="lb-nav lb-prev" aria-label="Назад">‹</button>
    <div id="lb-stage" class="lb-stage"></div>
    <button type="button" class="lb-nav lb-next" aria-label="Вперёд">›</button>
    <div id="lb-meta" class="lb-meta"></div>
  </div>

  <script type="module" src="js/gallery.js"></script>
</body>
</html>
