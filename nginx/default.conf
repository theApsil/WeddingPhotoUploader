# HTTP — ACME challenge + redirect to HTTPS when certs exist.
# For first boot without certificates, proxy on :80 so the site is reachable;
# after Let's Encrypt, enable the HTTPS server block and redirect.

upstream photo_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://photo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

